<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../datetime.css" />
    <title>Heart Glow Picker</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "CoolRegularScript", serif;
        background: #fbe9f1;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      @font-face {
        font-family: "CoolRegularScript";
        src: url("../font/font1.ttf") format("truetype");
      }
      .text-panel {
        position: fixed;
        top: 3%;
        left: 30%;
        font-size: 40px;
        font-weight: 600px;
      }

      /* --- Sidebar Buttons --- */
      .left-panel {
        position: fixed;
        top: 10%;
        width: 40%;
        left: 25%;
        display: flex;
        flex-direction: row;
        gap: 10%;
      }

      .btn {
        width: 150%;
        padding: 12px 0;
        border-radius: 12px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        border: none;
        outline: none;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        transition: 0.2s;
      }
      .btn:hover {
        transform: scale(1.05);
      }

      .btn-red {
        background: #ff5c8d;
      }
      .btn-blue {
        background: #5c9dff;
      }
      .btn-green {
        background: #4cd199;
      }

      /* --- Main Circle --- */
      .main-area {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .circle {
        width: 350px;
        height: 350px;
        background: white;
        border-radius: 50%;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 20px rgba(255, 182, 193, 0.4);
      }

      /* --- Heart Blob --- */
      .heart {
        position: absolute;
        width: 35px;
        height: 35px;
        background: currentColor;
        opacity: 0.9;
        border-radius: 60% 60% 50% 50%;
        transform: rotate(-45deg);
        filter: blur(2px);
        animation: floatHeart 6s infinite ease-in-out;
      }

      .heart::after,
      .heart::before {
        content: "";
        position: absolute;
        width: 35px;
        height: 35px;
        background: currentColor;
        border-radius: 50%;
      }

      .heart::before {
        top: -18px;
        left: 0;
      }
      .heart::after {
        top: 0;
        left: 18px;
      }

      @keyframes floatHeart {
        0% {
          transform: translateY(0) rotate(-45deg);
        }
        50% {
          transform: translateY(-20px) rotate(-45deg);
        }
        100% {
          transform: translateY(0) rotate(-45deg);
        }
      }

      /* --- Jar Right Panel --- */
      .right-panel {
        width: 200px;
        padding: 20px;
        background: #fff7fb;
        box-shadow: -5px 0 15px rgba(0, 0, 0, 0.05);
        overflow-y: auto;
      }

      .jar-title {
        font-weight: bold;
        margin-bottom: 10px;
        text-align: center;
      }

      .jar-list div {
        width: 100%;
        height: 35px;
        border-radius: 10px;
        margin-bottom: 10px;
        cursor: pointer;
      }

      /* --- Popup --- */
      .popup-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
      }

      .popup-box {
        background: white;
        padding: 25px;
        border-radius: 15px;
        width: 300px;
        text-align: center;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .close-btn {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        border-radius: 12px;
        border: none;
        background: #ff88b3;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="btnplace">
      <button class="btnclock" id="btnClock">今天</button>
      <button class="btnclock" id="btnCount">我們在一起第</button>
    </div>
    <div class="content">
      <div class="signboard outer">
        <div class="signboard front inner anim04c">
          <li class="year anim04c">
            <span></span>
          </li>
          <ul class="calendarMain anim04c">
            <li class="month anim04c">
              <span></span>
            </li>
            <li class="date anim04c">
              <span></span>
            </li>
            <li class="day anim04c">
              <span></span>
            </li>
          </ul>
          <li class="clock minute anim04c">
            <span></span>
          </li>
          <li class="calendarNormal date2 anim04c">
            <span></span>
          </li>
        </div>
        <div class="signboard left inner anim04c">
          <li class="clock hour anim04c">
            <span></span>
          </li>
          <li class="calendarNormal day2 anim04c">
            <span></span>
          </li>
        </div>
        <div class="signboard right inner anim04c">
          <li class="clock second anim04c">
            <span></span>
          </li>
          <li class="calendarNormal month2 anim04c">
            <span></span>
          </li>
        </div>
      </div>
    </div>

    <div class="countdown">
      <h2 id="titleDisplay">倒數計時名稱 ⏳✨</h2>
      <div class="timeRow">
        <h2 id="countdownText" style="margin-top: 10px">--:--:--</h2>

        <button
          id="toggleBtn"
          style="
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 8px;
            background: url('../img/count.png') no-repeat center/contain;
            cursor: pointer;
          "
        ></button>
      </div>

      <!-- ส่วนนี้จะถูกซ่อน -->
      <div
        id="configBox"
        style="
          margin-top: 15px;
          padding: 15px;
          border: 1px solid #ccc;
          border-radius: 12px;
          background: #fff;
          display: none;
          transition: 0.3s;
        "
      >
        <input
          type="text"
          id="titleInput"
          placeholder="倒數計時名稱..."
          style="
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 250px;
            margin-bottom: 10px;
            display: block;
          "
        />

        <input
          type="date"
          id="datePicker"
          style="
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            display: block;
            margin-bottom: 10px;
          "
        />

        <button
          id="setBtn"
          style="
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #eb8abb;
            color: white;
            cursor: pointer;
          "
        >
          儲存 💾
        </button>
        <button
          id="resetBtn"
          style="
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: #ff6b6b;
            color: white;
            cursor: pointer;
          "
        >
          重設 🔄
        </button>
      </div>
    </div>
    <div class="text-panel">寶寶</div>
    <!-- Left Buttons -->
    <div class="left-panel">
      <button class="btn btn-red" onclick="pickColor('red')">
        我愛你因為...
      </button>
      <button class="btn btn-blue" onclick="pickColor('blue')">
        你難過嗎？你試著打開看看阿
      </button>
      <button class="btn btn-green" onclick="pickColor('green')">隨機</button>
    </div>

    <!-- Circle -->
    <div class="main-area">
      <div class="circle" id="heartContainer"></div>
    </div>

    <!-- Jar Panel -->
    <div class="right-panel">
      <div class="jar-title">💌 保存訊息記錄</div>
      <div class="jar-list" id="jarList"></div>
    </div>

    <!-- Popup -->
    <div class="popup-bg" id="popup">
      <div class="popup-box">
        <div id="popupText"></div>
        <button class="close-btn" onclick="closePopup()">ปิด</button>
      </div>
    </div>
    <div id="loader">
      <div class="heart-loader"></div>
    </div>

    <script src="../datetime.js"></script>
    <script src="../mail/texts.js"></script>

    <script>
      /* ใช้เฉพาะจำนวนข้อความสีแดง */
      const totalMessageCount = texts.red.length;

      let flyData = null;
      let currentMessage = "";

      /* ------------------------ HEART GENERATION ------------------------ */
      function spawnHearts() {
        const colors = { red: "#ff5c8d", blue: "#5c9dff", green: "#4cd199" };
        const safe = 110;
        const center = 175;
        const count = totalMessageCount;

        Object.keys(colors).forEach((color) => {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = safe * Math.sqrt(Math.random());
            const x = center + Math.cos(angle) * r;
            const y = center + Math.sin(angle) * r;

            const h = document.createElement("div");
            h.classList.add("heart");
            h.style.color = colors[color];
            h.style.left = x - 20 + "px";
            h.style.top = y - 20 + "px";
            h.style.animationDuration = 5 + Math.random() * 3 + "s";
            h.dataset.color = color;

            document.getElementById("heartContainer").appendChild(h);
          }
        });
      }
      spawnHearts();

      /* ------------------------ PICK COLOR ------------------------ */
      function pickColor(color) {
        if (texts[color].length === 0) {
          alert("ไม่มีข้อความสีนี้แล้ว");
          return;
        }

        const index = Math.floor(Math.random() * texts[color].length);
        const message = texts[color].splice(index, 1)[0];
        currentMessage = message;

        const target = document.querySelector(`.heart[data-color="${color}"]`);

        if (target) {
          const rect = target.getBoundingClientRect();

          flyData = { x: rect.left, y: rect.top, color: color };
          target.remove();
        }

        document.getElementById("popupText").innerText = message;
        document.getElementById("popup").style.display = "flex";
      }

      /* ------------------------ CLOSE POPUP ------------------------ */
      function closePopup() {
        document.getElementById("popup").style.display = "none";

        if (flyData) {
          const fly = document.createElement("div");
          fly.classList.add("heart");
          fly.style.color =
            flyData.color === "red"
              ? "#ff5c8d"
              : flyData.color === "blue"
              ? "#5c9dff"
              : "#4cd199";

          fly.style.position = "absolute";
          fly.style.left = flyData.x + "px";
          fly.style.top = flyData.y + "px";
          fly.style.width = "35px";
          fly.style.height = "35px";
          fly.style.filter = "blur(0px)";
          fly.style.animation = "none";
          fly.style.zIndex = "99999";
          fly.style.transition = "0.9s cubic-bezier(.42,0,.19,1.43)";

          document.body.appendChild(fly);

          const jarRect = document
            .getElementById("jarList")
            .getBoundingClientRect();

          requestAnimationFrame(() => {
            fly.style.left = jarRect.left + 40 + "px";
            fly.style.top = jarRect.top + 20 + "px";
            fly.style.transform = "scale(0.4)";
            fly.style.opacity = "0";
          });

          setTimeout(() => fly.remove(), 1000);

          /* เพิ่มเป็นกล่องสีเท่านั้น */
          const jar = document.getElementById("jarList");
          const div = document.createElement("div");

          div.dataset.message = currentMessage;
          div.style.background =
            flyData.color === "red"
              ? "#ff5c8d"
              : flyData.color === "blue"
              ? "#5c9dff"
              : "#4cd199";

          div.onclick = () => openOldMessage(div.dataset.message);

          jar.appendChild(div);

          flyData = null;
        }
      }

      /* ------------------------ OPEN OLD MESSAGE ------------------------ */
      function openOldMessage(text) {
        currentMessage = text;
        document.getElementById("popupText").innerText = text;
        document.getElementById("popup").style.display = "flex";
      }
    </script>
  </body>
</html>
