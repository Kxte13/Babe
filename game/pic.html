<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Picture Choice Random 10 from 20</title>
    <style>
      body {
        background: #f7c9d8;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 30px;
      }

      .top-pic {
        width: 250px;
        height: 150px;
        background: white;
        border-radius: 15px;
        margin: 0 auto 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 3px solid #e58aa3;
      }

      .top-pic img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .pic-row {
        display: flex;
        gap: 20px;
        justify-content: center;
      }

      .pic-box {
        width: 200px;
        height: 150px;
        background: white;
        border-radius: 15px;
        overflow: hidden;
        cursor: pointer;
        border: 3px solid #ffffff;
        transition: 0.2s;
      }

      .pic-box:hover {
        border-color: #ff6fa5;
        transform: scale(1.05);
      }

      .pic-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #result {
        margin-top: 25px;
        font-size: 20px;
        font-weight: bold;
        color: #b30044;
        white-space: pre-line;
      }

      #restartBtn {
        margin-top: 25px;
        padding: 12px 20px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        background: #ff6fa5;
        color: white;
        cursor: pointer;
        display: none;
        transition: 0.2s;
      }

      #restartBtn:hover {
        background: #ff4f8b;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <h2>เลือกภาพด้านล่าง</h2>

    <div class="top-pic">
      <img id="topImg" />
    </div>

    <div class="pic-row">
      <div class="pic-box" onclick="choosePic(0)">
        <img id="img0" />
      </div>
      <div class="pic-box" onclick="choosePic(1)">
        <img id="img1" />
      </div>
    </div>

    <div id="result"></div>
    <button id="restartBtn" onclick="restart()">เริ่มใหม่</button>

    <script>
      // ===============================
      //     รูปทั้งหมด 20 รูป + ข้อความ
      // ===============================
      const masterPics = Array.from({ length: 20 }, (_, i) => ({
        img: `https://picsum.photos/300?random=${i + 1}`,
        msg: `ข้อความของรูปที่ ${i + 1}`,
      }));

      let selectedSet = []; // 10 รูปที่สุ่มมารอบนี้
      let used = 0; // index รูปที่ใช้ไปแล้ว

      function startGame() {
        // สุ่มรูป 10 จาก 20
        selectedSet = masterPics.sort(() => Math.random() - 0.5).slice(0, 10);

        used = 2;

        // โหลดรูปเริ่มต้น
        document.getElementById("img0").src = selectedSet[0].img;
        document.getElementById("img1").src = selectedSet[1].img;

        document.getElementById("topImg").src = "";
        document.getElementById("result").innerText = "";
        document.getElementById("restartBtn").style.display = "none";
      }

      startGame();

      function choosePic(index) {
        const selectedSrc = document.getElementById("img" + index).src;
        document.getElementById("topImg").src = selectedSrc;

        const selectedObj = selectedSet.find((p) => p.img === selectedSrc);

        // ถ้ารูปหมดแล้ว
        if (used >= selectedSet.length) {
          document.getElementById("result").innerText =
            "รูปสุดท้ายที่คุณเลือกคือ:\n" +
            selectedObj.img +
            "\n\nข้อความของรูปนั้น:\n" +
            selectedObj.msg;

          document.getElementById("restartBtn").style.display = "inline-block";
          return;
        }

        // เปลี่ยนรูปเฉพาะใบที่ไม่ถูกเลือก
        const other = index === 0 ? 1 : 0;
        document.getElementById("img" + other).src = selectedSet[used].img;

        used++;
      }

      function restart() {
        startGame();
      }
    </script>
  </body>
</html>
